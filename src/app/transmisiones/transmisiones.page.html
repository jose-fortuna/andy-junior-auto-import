<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Catálogo de transmisiones</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Transmisiones importadas</h1>
  <p>Transmisiones de calidad con garantía.</p>

  @for (transmision of transmisiones; track transmision.id) {

    <ion-card>
      <ion-card-header>
        <ion-card-title>
          {{ transmision.nombre }}
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list>

          <ion-item>
            <ion-label>
              Tipo: {{ transmision.tipo }}
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              Año: {{ transmision.anio }}
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-label>
              Precio: {{ transmision.precio }}
            </ion-label>
          </ion-item>

        </ion-list>
      </ion-card-content>
    </ion-card>

  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/home">
      <ion-icon name="home-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
