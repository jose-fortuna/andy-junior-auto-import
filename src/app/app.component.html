<ion-app>

  <ion-split-pane contentId="contenido-principal" when="md">

    <ion-menu contentId="contenido-principal" type="overlay">

      <ion-header>
        <ion-toolbar color="danger">
          <ion-title>Menú principal</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>

        <div class="encabezado-menu">

          <img
            src="assets/img/logo.jpeg"
            alt="Andy Junior Auto Import">

          <h2>Andy Junior Auto Import</h2>

          <p>Calidad y garantía</p>

        </div>

        <ion-list>

          <ion-menu-toggle autoHide="false">

            <ion-item routerLink="/home" button>
              <ion-icon name="home-outline" slot="start"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>

            <ion-item routerLink="/motores" button>
              <ion-icon name="settings-outline" slot="start"></ion-icon>
              <ion-label>Motores</ion-label>
            </ion-item>

            <ion-item routerLink="/transmisiones" button>
              <ion-icon name="cog-outline" slot="start"></ion-icon>
              <ion-label>Transmisiones</ion-label>
            </ion-item>

            <ion-item routerLink="/repuestos" button>
              <ion-icon name="construct-outline" slot="start"></ion-icon>
              <ion-label>Repuestos</ion-label>
            </ion-item>

          </ion-menu-toggle>

        </ion-list>

      </ion-content>

    </ion-menu>

    <ion-router-outlet id="contenido-principal">
    </ion-router-outlet>

  </ion-split-pane>

</ion-app>
